# Configuração Centralizada de Resolução de Tickers
# Sistema unificado para mapeamentos, normalizações e ações corporativas

version: "3.0"
updated: "2025-09-12" 
description: "Configuração centralizada para resolução de tickers - substitui mapeamentos hardcoded"

# Política de forced sale
policy:
  forced_sale_mode: "strict"   # "default" (mergers continuam) ou "strict" (forced sale para não-rebranding)
  note: "Em modo strict: aquisições, falências e mergers geram forced sale; apenas rebranding simples continua a série."

# Regras de normalização automática de símbolos
normalization_rules:
  # Conversão de formato para classes de ações
  dot_to_hyphen:
    enabled: true
    pattern: "\\."
    replacement: "-"
    description: "Stooq usa hífen para classes: BRK.B → BRK-B"
    
  # Sufixos removidos automaticamente
  remove_suffixes:
    - ".US"
    - ".NYSE" 
    - ".NASDAQ"
    
  # Correções bidirecionais específicas
  symbol_corrections:
    "BRK.B": "BRK-B"
    "BF.B": "BF-B"
    # Mapeamento reverso também
    "BRK-B": "BRK-B"  # Confirmar formato Stooq
    "BF-B": "BF-B"    # Confirmar formato Stooq

# Renomeações corporativas simples (apenas mudança de ticker, série contínua)
corporate_renames:
  # Confirmadas 2020-2024 - Apenas ticker changes, não aquisições
  "ANTM": "ELV"      # Anthem → Elevance Health (2022) - rebranding
  "CTL": "LUMN"      # CenturyLink → Lumen Technologies (2020) - rebranding
  "FISV": "FI"       # Fiserv mudança de símbolo
  "FB": "META"       # Facebook → Meta Platforms (2021) - rebranding
  "META": "META"     # Meta mantém o mesmo ticker (já é o atual)
  "NLOK": "GEN"      # NortonLifeLock → Gen Digital (2022) - rebranding
  "VIAC": "PARAA"    # ViacomCBS → Paramount Global (classe A em Stooq) - rebranding
  "COG": "CTRA"      # Cabot Oil & Gas → Coterra (2021) - rebranding
  "MYL": "VTRS"      # Mylan → Viatris - merger equals, nova entidade
  "DWDP": "DD"       # DowDuPont → DuPont (2019) - spin-off

  # Mapeamentos de normalização
  "BLL": "BALL"      # Ball Corporation - normalização
  "RE": "RGA"        # Reinsurance Group - normalização
  "RVTYP": "RVTY"    # Revvity correção de símbolo
  "FBHS": "FBIN"     # Fortune Brands - normalização
  "HCP": "PEAK"      # Healthcare Properties → Healthpeak - rebranding
  "ADS": "BFH"       # Alliance Data → Bread Financial - rebranding
  "PKI": "RVTY"      # PerkinElmer → Revvity (16-mai-2023) - spin-off + rebranding
  "FLT": "CPAY"      # FleetCor → Corpay (25-mar-2024) - rebranding
  "TMK": "GL"        # Torchmark → Globe Life (09-ago-2019) - rebranding
  "WLTW": "WTW"      # Willis Towers Watson - normalização
  "ABC": "COR"       # AmerisourceBergen → Cencora - rebranding
  "GPS": "GAP"       # Gap Inc. - normalização

  # Renomeações adicionais 2010-2024 - apenas ticker changes
  "GR": "TGNA"        # Gannett Co. → Tegna Inc. (jun-2015) - spin-off
  "NYX": "ICE"        # NYSE Euronext → Intercontinental Exchange (nov-2013) - merger equals
  "RX": "IQV"         # IMS Health → IQVIA (IQV) (out-2016) - merger equals (ticker IQV)
  "IGT": "IGT"        # International Game Tech - ativo desde fusão GTECH 2015

