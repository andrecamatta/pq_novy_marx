# Preferências de classe de ações
share_class_preferences:
  "GOOG": "GOOGL"    # Prefere classe A (com voto)
  "GOOGL": "GOOGL"   # Mantém se já é A
  "PARA": "PARAA"    # Em Stooq, disponível como classe A

# Configuração de qualidade de dados
data_quality_rules:
  # Tickers com problemas temporários conhecidos
  temporary_issues:
    "DIS":
      note: "Disney ocasionalmente tem problemas no Stooq; se faltar, usar Tiingo direto"
      
    "FLT":
      status: "monitoring"
      note: "FleetCor pode ter problemas temporários de dados"

    "IGT":
      prefer_tiingo: true
      alternatives: ["IGT"]
      note: "IGT pré-2015 via Tiingo (gaps no Stooq)"

    "JCP":
      alternatives: ["JCPNQ", "JCP", "JCPB"]
      note: "J.C. Penney: tentar OTC JCPNQ; fallback para JCP/JCPB se necessário"

    "CBS":
      prefer_tiingo: true
      alternatives: ["CBS"]
      note: "CBS: preferir Tiingo (pré-2019), evitar Search por fundos"

    "ESV":
      prefer_tiingo: true
      alternatives: ["ESV"]
      note: "Ensco (ESV) pré-2019 via Tiingo"

    "HFC":
      prefer_tiingo: true
      alternatives: ["HFC"]
      note: "HFC pré-2022 via Tiingo"

    "BDK":
      prefer_tiingo: true
      alternatives: ["BDK"]
      note: "Black & Decker pré-2010-03-12 via Tiingo"

    "MDP":
      prefer_tiingo: true
      alternatives: ["MDP"]
      note: "Meredith (MDP) pré-2021-12-01 via Tiingo"
      

# Configuração de fontes de dados
data_sources:
  primary:
    name: "stooq"
    priority: 1
    timeout_seconds: 30
    retry_attempts: 3
    base_url: "https://stooq.com/"
    note: "Dados históricos via arquivo bulk manual (d_us_txt.zip)"
    
  fallback:
    - name: "tiingo"
      priority: 2
      timeout_seconds: 25
      retry_attempts: 0
      note: "API Tiingo como fallback para tickers não encontrados no Stooq"

# Estratégias de resolução (ordem de tentativa)
resolution_strategies:
  - name: "direct_lookup"
    description: "Usar ticker original sem modificação"
    
  - name: "apply_renames"
    description: "Verificar renomeações corporativas"
    
  - name: "normalize_symbol"
    description: "Aplicar regras de normalização"
    
  - name: "check_preferences"
    description: "Usar preferências de classe de ações"
    
  - name: "corporate_actions"
    description: "Verificar aquisições e fusões"
    
  - name: "alternative_formats"
    description: "Tentar formatos alternativos (hífen/ponto)"

  - name: "tiingo_search"
    description: "Usar Tiingo Search API para resolução dinâmica"
    

# Metadados de auditoria
metadata:
  migrated_from:
    - "src/ticker_resolver.jl TICKER_MAPPINGS constant"
    - "data/ticker_mappings.json"
    - "hardcoded normalization rules"
  total_mappings: 68
  confidence_level: "high"
  last_validation: "2025-09-13"
  notes: 
    - "Consolidação de todos mapeamentos hardcoded"
    - "Estrutura extensível para novos tipos de ação corporativa"
    - "Configuração versionada e auditável"
